name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run static tests
        shell: powershell
        run: .\tests\Static.Tests.ps1
      - name: Build MSIX smoke package
        shell: powershell
        run: .\tests\PackageBuild.Tests.ps1
